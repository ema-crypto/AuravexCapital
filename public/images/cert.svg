<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Georgia, 'Times New Roman', serif">
  <!-- Parchment background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf6e3;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f5e8c0;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="seal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b8860b"/>
      <stop offset="100%" style="stop-color:#8b6914"/>
    </linearGradient>
    <linearGradient id="banner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a2244"/>
      <stop offset="50%" style="stop-color:#1a3a6c"/>
      <stop offset="100%" style="stop-color:#0a2244"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20,0 L0,0 L0,20" fill="none" stroke="#c9a22722" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" fill="url(#bg)"/>
  <rect width="800" height="560" fill="url(#grid)"/>

  <!-- Outer border - double line -->
  <rect x="12" y="12" width="776" height="536" rx="4" fill="none" stroke="#8b6914" stroke-width="3"/>
  <rect x="20" y="20" width="760" height="520" rx="2" fill="none" stroke="#8b6914" stroke-width="1"/>

  <!-- Corner ornaments -->
  <g stroke="#8b6914" stroke-width="1.5" fill="none">
    <!-- Top-left -->
    <path d="M12,50 Q12,12 50,12"/>
    <path d="M20,55 Q20,20 55,20"/>
    <circle cx="36" cy="36" r="8" fill="#c9a227" opacity="0.6"/>
    <!-- Top-right -->
    <path d="M788,50 Q788,12 750,12"/>
    <path d="M780,55 Q780,20 745,20"/>
    <circle cx="764" cy="36" r="8" fill="#c9a227" opacity="0.6"/>
    <!-- Bottom-left -->
    <path d="M12,510 Q12,548 50,548"/>
    <path d="M20,505 Q20,540 55,540"/>
    <circle cx="36" cy="524" r="8" fill="#c9a227" opacity="0.6"/>
    <!-- Bottom-right -->
    <path d="M788,510 Q788,548 750,548"/>
    <path d="M780,505 Q780,540 745,540"/>
    <circle cx="764" cy="524" r="8" fill="#c9a227" opacity="0.6"/>
  </g>

  <!-- Header banner -->
  <rect x="40" y="38" width="720" height="56" rx="3" fill="url(#banner)"/>

  <!-- UK Crown / Coat of Arms placeholder -->
  <text x="400" y="60" text-anchor="middle" font-size="22" fill="#c9a227">✦</text>
  <text x="400" y="84" text-anchor="middle" font-size="11" fill="#d4af37" font-family="Georgia,serif" letter-spacing="3" font-weight="bold">COMPANIES HOUSE — ENGLAND &amp; WALES</text>

  <!-- Title -->
  <text x="400" y="130" text-anchor="middle" font-size="22" fill="#0a2244" font-weight="bold" letter-spacing="1">CERTIFICATE OF INCORPORATION</text>
  <line x1="120" y1="138" x2="680" y2="138" stroke="#c9a227" stroke-width="1.5"/>
  <line x1="140" y1="142" x2="660" y2="142" stroke="#c9a227" stroke-width="0.5"/>

  <!-- Preamble -->
  <text x="400" y="168" text-anchor="middle" font-size="12" fill="#333">I hereby certify that</text>

  <!-- Company Name -->
  <text x="400" y="206" text-anchor="middle" font-size="30" fill="#0a2244" font-weight="bold" font-style="italic">AuravexCapital Limited</text>
  <line x1="130" y1="214" x2="670" y2="214" stroke="#8b6914" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- Body text -->
  <text x="400" y="244" text-anchor="middle" font-size="12" fill="#333">is this day incorporated under the Companies Act 2006 as a</text>
  <text x="400" y="262" text-anchor="middle" font-size="13" fill="#0a2244" font-weight="bold">PRIVATE COMPANY LIMITED BY SHARES</text>
  <text x="400" y="282" text-anchor="middle" font-size="12" fill="#333">and that the company is limited.</text>

  <!-- Details box -->
  <rect x="100" y="300" width="600" height="110" rx="4" fill="none" stroke="#8b6914" stroke-width="1"/>
  <rect x="100" y="300" width="600" height="28" rx="4" fill="#0a2244" opacity="0.08"/>

  <text x="400" y="320" text-anchor="middle" font-size="11" fill="#0a2244" font-weight="bold" letter-spacing="1">REGISTRATION DETAILS</text>

  <!-- Left column -->
  <text x="120" y="348" font-size="11" fill="#666">Company Number:</text>
  <text x="120" y="365" font-size="13" fill="#0a2244" font-weight="bold">14872356</text>

  <text x="120" y="390" font-size="11" fill="#666">Date of Incorporation:</text>
  <text x="120" y="406" font-size="13" fill="#0a2244" font-weight="bold">14 March 2019</text>

  <!-- Right column -->
  <text x="430" y="348" font-size="11" fill="#666">Registered in:</text>
  <text x="430" y="365" font-size="13" fill="#0a2244" font-weight="bold">England and Wales</text>

  <text x="430" y="390" font-size="11" fill="#666">Registered Office:</text>
  <text x="430" y="406" font-size="12" fill="#0a2244" font-weight="bold">London, EC2V 8RF, UK</text>

  <!-- Divider -->
  <line x1="80" y1="432" x2="720" y2="432" stroke="#8b6914" stroke-width="0.8"/>

  <!-- Signatures area -->
  <text x="180" y="455" text-anchor="middle" font-size="11" fill="#555">Signed for Companies House</text>
  <text x="600" y="455" text-anchor="middle" font-size="11" fill="#555">Date of Issue</text>

  <!-- Signature line left -->
  <line x1="90" y1="490" x2="280" y2="490" stroke="#333" stroke-width="1"/>
  <!-- Signature scribble -->
  <path d="M110,488 Q130,476 150,483 Q170,490 190,478 Q210,468 230,480 Q250,490 265,485" fill="none" stroke="#0a2244" stroke-width="1.5"/>
  <text x="180" y="504" text-anchor="middle" font-size="9" fill="#555">Registrar of Companies</text>

  <!-- Signature line right -->
  <line x1="510" y1="490" x2="700" y2="490" stroke="#333" stroke-width="1"/>
  <text x="600" y="480" text-anchor="middle" font-size="13" fill="#0a2244" font-weight="bold">14 March 2019</text>
  <text x="600" y="504" text-anchor="middle" font-size="9" fill="#555">Official Date</text>

  <!-- Gold embossed seal -->
  <circle cx="400" cy="490" r="36" fill="url(#seal)" opacity="0.85"/>
  <circle cx="400" cy="490" r="32" fill="none" stroke="#d4af37" stroke-width="1.5"/>
  <circle cx="400" cy="490" r="24" fill="none" stroke="#d4af37" stroke-width="0.8"/>
  <text x="400" y="484" text-anchor="middle" font-size="9" fill="#ffd700" font-weight="bold" letter-spacing="1">COMPANIES</text>
  <text x="400" y="496" text-anchor="middle" font-size="9" fill="#ffd700" font-weight="bold" letter-spacing="1">HOUSE</text>
  <!-- Star points around seal -->
  <g fill="#d4af37" opacity="0.7">
    <polygon points="400,452 403,462 413,462 405,468 408,478 400,472 392,478 395,468 387,462 397,462" transform="scale(0.6) translate(267,310)"/>
  </g>
  <text x="400" y="468" text-anchor="middle" font-size="16" fill="#ffd700">✦</text>
  <text x="400" y="514" text-anchor="middle" font-size="7" fill="#ffd700" letter-spacing="0.5">OFFICIAL SEAL</text>

  <!-- Footer note -->
  <text x="400" y="542" text-anchor="middle" font-size="9" fill="#888" font-style="italic">This certificate confirms incorporation under the Companies Act 2006. Verify at companieshouse.gov.uk using company number 14872356.</text>
</svg>
